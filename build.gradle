buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.flywaydb:flyway-core:10.18.0"
        classpath 'org.flywaydb:flyway-mysql:10.18.0'
        classpath "com.mysql:mysql-connector-j:8.0.33"
    }
}


plugins {
    id "java"
    id "org.springframework.boot" version '3.2.3'
    id "io.spring.dependency-management" version '1.1.4'
    id "jacoco"
    id "org.sonarqube" version '4.4.1.3373'
    id "org.flywaydb.flyway" version "10.19.0"
    id "org.jooq.jooq-codegen-gradle" version "3.20.5"
}

group = 'com.pikachu'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

sonar {
    properties {
        property("sonar.projectKey", "pikachu-perfume_purple-server")
        property("sonar.organization", "pikachu-perfume")
        property("sonar.host.url", "https://sonarcloud.io")
        property("sonar.java.coveragePlugin", "jacoco")
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'junit:junit:4.13.1'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

//    implementation 'com.mysql:mysql-connector-j:8.2.0'
    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.1.0'

    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'javax.mail:javax.mail-api:1.6.2'

    // jwt
    implementation 'com.auth0:java-jwt:4.4.0'
    implementation 'com.auth0:jwks-rsa:0.22.1'

    // S3
    implementation 'io.awspring.cloud:spring-cloud-aws-s3:3.0.2'

    // redis - redisson
    implementation 'org.redisson:redisson-spring-boot-starter:3.35.0'

    // java.time 패키지의 날짜/시간 클래스를 JSON으로 직렬화하거나 역직렬화하기 위한 패키지
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    // flyway
    implementation "org.flywaydb:flyway-core:10.18.0"
    implementation "org.flywaydb:flyway-mysql:10.18.0"

    //thymeleaf
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    //jooq
    implementation "org.jooq:jooq:3.20.5"
    jooqCodegen "org.jooq:jooq-meta:3.20.5"
    jooqCodegen "org.jooq:jooq-codegen:3.20.5"
    jooqCodegen "org.jooq:jooq-meta-extensions:3.20.5"
    jooqCodegen 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
    useJUnitPlatform()
}

ext {
    dbUrl = findProperty('DB_URL') ?: ''
    dbUser = findProperty('DB_USERNAME') ?: ''
    dbPasswd = findProperty('DB_PASSWORD') ?: ''
    dbSchema = findProperty('DB_SCHEMA') ?: ''
    dbDriver = 'com.mysql.cj.jdbc.Driver'
}


flyway {
    url = dbUrl
    user = dbUser
    password = dbPasswd
    driver = dbDriver
}

jooq {
    configuration {
        jdbc {
            driver = dbDriver
            url = dbUrl
            user = dbUser
            password = dbPasswd
        }
        generator {
            name = "org.jooq.codegen.JavaGenerator"
            database {
                name = "org.jooq.meta.extensions.ddl.DDLDatabase"
                properties {
                    property {
                        key = "scripts"
                        value = "src/main/resources/db/migration/*.sql"
                    }
                    property {
                        key = "sort"
                        value = "flyway"
                    }
                    property {
                        key = "sql"
                        value = """
                            CREATE SCHEMA IF NOT EXISTS $dbSchema;
                            SET SCHEMA $dbSchema;           
                        """
                    }
                    property {
                        key = "unqualifiedSchema"
                        value = "none"
                    }
                    property {
                        key = "defaultNameCase"
                        value = "lower"
                    }
                }
            }
            target {
                packageName = "org.jooq.generated"
                directory = "src/generated"
            }

        }
    }
}

tasks.named("compileJava") {
    dependsOn("jooqCodegen")
}
